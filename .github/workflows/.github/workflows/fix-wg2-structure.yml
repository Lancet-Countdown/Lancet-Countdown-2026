name: Fix WG2 folder structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-wg2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Working-Group-2
        uses: actions/checkout@v4
        with:
          ref: Working-Group-2
          fetch-depth: 0

      - name: Create WG2 folder and move indicators
        run: |
          mkdir -p WG2

          for folder in "Indicator 2."*; do
            if [ -d "$folder" ]; then
              git mv "$folder" WG2/
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Organise WG2 indicators under WG2 folder"
            git push origin Working-Group-2
          fi
